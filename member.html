<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>UTARA GARAGE | Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0515;
            font-family: 'Quicksand', sans-serif;
            color: #f0e6ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(156, 108, 214, 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(156, 108, 214, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(107, 70, 160, 0.25) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(183, 126, 230, 0.2) 0%, transparent 50%),
                        linear-gradient(135deg, #0a0515 0%, #150d25 50%, #0a0515 100%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1280px;
            width: 90%;
            margin: 0 auto;
            padding: 2rem 0;
            position: relative;
            z-index: 10;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(156, 108, 214, 0.2);
            border: 1px solid rgba(156, 108, 214, 0.5);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            color: #b77ee6;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: rgba(156, 108, 214, 0.4);
            transform: translateY(-2px);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 8vw, 3rem);
            background: linear-gradient(135deg, #e0d4ff, #b77ee6, #9c6cd6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #b89fd9;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 600;
            margin: 0.5rem 0 1.5rem;
            font-family: 'Playfair Display', serif;
            color: #b77ee6;
            position: relative;
            display: inline-block;
            text-align: center;
            width: 100%;
        }

        .section-title:before {
            content: '✦';
            position: absolute;
            left: -25px;
            top: 0;
            color: #9c6cd6;
            font-size: clamp(1rem, 4vw, 1.5rem);
        }

        .section-title:after {
            content: '✦';
            position: absolute;
            right: -25px;
            top: 0;
            color: #9c6cd6;
            font-size: clamp(1rem, 4vw, 1.5rem);
        }

        @media (max-width: 600px) {
            .section-title:before, .section-title:after {
                display: none;
            }
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .gallery-item {
            background: rgba(15, 10, 25, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 0.8rem;
            border: 1px solid rgba(156, 108, 214, 0.3);
            transition: all 0.4s ease;
            animation: fadeInUp 0.6s ease backwards;
            overflow: hidden;
            cursor: pointer;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .gallery-item:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #b77ee6;
            box-shadow: 0 20px 40px rgba(107, 70, 160, 0.4);
        }

        .gallery-item .image-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(26, 15, 42, 0.5);
            position: relative;
        }

        .gallery-item .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }

        .gallery-item:hover .image-wrapper img {
            transform: scale(1.05);
        }

        .gallery-item .photo-caption {
            text-align: center;
            padding: 0.8rem 0 0.3rem;
            font-size: 0.75rem;
            color: #b89fd9;
            letter-spacing: 1px;
            margin-top: auto;
        }

        .gallery-item .photo-caption i {
            color: #b77ee6;
            margin-right: 6px;
        }

        .stats {
            background: rgba(156, 108, 214, 0.15);
            border-radius: 50px;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.4s ease;
            padding: 2rem;
        }

        .lightbox-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 85vh;
            position: relative;
            animation: zoomIn 0.4s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 20px;
            border: 2px solid rgba(183, 126, 230, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }

        .lightbox-close {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(156, 108, 214, 0.3);
            border: 2px solid rgba(183, 126, 230, 0.5);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }

        .lightbox-close:hover {
            background: rgba(183, 126, 230, 0.5);
            transform: rotate(90deg);
        }

        .lightbox-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            color: #b77ee6;
            font-size: 0.85rem;
            border: 1px solid rgba(156, 108, 214, 0.3);
            z-index: 2001;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(156, 108, 214, 0.2);
            border: 1px solid rgba(183, 126, 230, 0.4);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }

        .lightbox-nav:hover {
            background: rgba(183, 126, 230, 0.4);
            transform: scale(1.1);
        }

        .lightbox-nav.prev {
            left: 30px;
        }

        .lightbox-nav.next {
            right: 30px;
        }

        @media (max-width: 768px) {
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .lightbox-nav.prev {
                left: 10px;
            }
            .lightbox-nav.next {
                right: 10px;
            }
            .lightbox-close {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 1.4rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
            .gallery-item {
                min-height: 200px;
            }
        }

        footer {
            text-align: center;
            border-top: 1px solid rgba(156, 108, 214, 0.3);
            padding: 2rem 1rem;
            margin-top: 2rem;
            background: rgba(10, 5, 21, 0.8);
            backdrop-filter: blur(10px);
        }

        .no-result {
            text-align: center;
            padding: 3rem;
            color: #b89fd9;
            background: rgba(15, 10, 25, 0.4);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            grid-column: 1 / -1;
        }

        .no-result i {
            font-size: 3rem;
            color: #b77ee6;
            margin-bottom: 1rem;
            display: block;
        }

        .image-error {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 15, 42, 0.8);
            color: #b89fd9;
            font-size: 0.8rem;
            gap: 8px;
        }
        .image-error i {
            font-size: 2.5rem;
            color: #b77ee6;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-gradient"></div>

    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <h1>✦ UG GALLERY ✦</h1>
            <p class="subtitle">Esthetic Purple Collection</p>
        </div>

        <div style="text-align: center; margin-bottom: 1rem;">
            <span class="stats"><i class="fas fa-image"></i> Total Photos: <span id="photoCount">0</span></span>
        </div>

        <div class="section-title">⌇ PURPLE DREAM COLLECTION ⌇</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" id="lightboxClose"><i class="fas fa-times"></i></button>
        <button class="lightbox-nav prev" id="lightboxPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="lightbox-nav next" id="lightboxNext"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Gallery Photo">
        </div>
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
    </div>

    <footer>
        <div class="copyright"><i class="fas fa-moon"></i> UTARA GARAGE • UG GALLERY • PURPLE DREAM<br><small>© 2026 Utara Garage - All Rights Reserved</small></div>
    </footer>

    <script>
        // ===== DATA GALERI =====
        const GALLERY_DATA = [
            { url: "https://cdn.phototourl.com/free/2026-07-24-1826c338-4919-4565-a286-2107abab444e.jpg", caption: "✦ Purple Dream ✦" },
            { url: "https://cdn.phototourl.com/free/2026-07-24-669ead91-e3be-4514-b484-b2fa0664a162.jpg", caption: "✦ Esthetic Vibes ✦" },
            { url: "https://cdn.phototourl.com/free/2026-07-24-fe53f5cc-8541-41a1-a7b4-775ddbe8f5f6.jpg", caption: "✦ Soft Aesthetic ✦" },
            { url: "https://cdn.phototourl.com/free/2026-07-24-aa90e6a5-f7f0-46c9-ad46-8f436e93e425.jpg", caption: "✦ Purple Edition ✦" },
            { url: "https://cdn.phototourl.com/free/2026-07-24-9ee5e2b9-7e79-4e53-80f0-f6c979457f7a.jpg", caption: "✦ Dream Collection ✦" },
            { url: "https://cdn.phototourl.com/free/2026-07-24-da57cb3f-ca96-4aa4-a1c4-70c8609b5d5f.jpg", caption: "✦ Moonlight Series ✦" },
            { url: "https://cdn.phototourl.com/free/2026-07-24-403aad83-ba60-43c0-8c5e-9f3c8a212235.jpg", caption: "✦ Purple Haze ✦" }
        ];

        let currentLightboxIndex = 0;

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const countSpan = document.getElementById('photoCount');
            
            if (!grid) return;
            
            if (countSpan) countSpan.textContent = GALLERY_DATA.length;

            if (GALLERY_DATA.length === 0) {
                grid.innerHTML = `
                    <div class="no-result">
                        <i class="fas fa-images"></i>
                        <p>✨ Belum ada foto di galeri ✨</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = GALLERY_DATA.map((photo, index) => `
                <div class="gallery-item" style="animation-delay: ${index * 0.05}s" onclick="openLightbox(${index})">
                    <div class="image-wrapper">
                        <img src="${photo.url}" alt="${photo.caption}" loading="lazy" 
                             onerror="this.parentElement.innerHTML='<div class=\\'image-error\\'><i class=\\'fas fa-image\\'></i><span>Gagal memuat gambar</span></div>'">
                    </div>
                    <div class="photo-caption">
                        <i class="fas fa-star"></i> ${escapeHtml(photo.caption)}
                    </div>
                </div>
            `).join('');
        }

        // ===== LIGHTBOX FUNCTION =====
        function openLightbox(index) {
            currentLightboxIndex = index;
            const overlay = document.getElementById('lightboxOverlay');
            const image = document.getElementById('lightboxImage');
            const counter = document.getElementById('lightboxCounter');
            
            if (!overlay || !image) return;
            
            image.src = GALLERY_DATA[index].url;
            image.alt = GALLERY_DATA[index].caption;
            image.onerror = function() {
                this.src = '';
                this.alt = 'Gambar tidak tersedia';
                this.parentElement.innerHTML = '<div style="padding:2rem;color:#b89fd9;"><i class="fas fa-image" style="font-size:3rem;display:block;margin-bottom:1rem;color:#b77ee6;"></i>Gambar tidak tersedia</div>';
            };
            
            if (counter) {
                counter.textContent = `${index + 1} / ${GALLERY_DATA.length}`;
            }
            
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightboxOverlay');
            if (overlay) {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        function navigateLightbox(direction) {
            const total = GALLERY_DATA.length;
            if (total === 0) return;
            
            currentLightboxIndex = (currentLightboxIndex + direction + total) % total;
            
            const image = document.getElementById('lightboxImage');
            const counter = document.getElementById('lightboxCounter');
            
            if (image) {
                image.src = GALLERY_DATA[currentLightboxIndex].url;
                image.alt = GALLERY_DATA[currentLightboxIndex].caption;
                image.onerror = function() {
                    this.src = '';
                    this.alt = 'Gambar tidak tersedia';
                    this.parentElement.innerHTML = '<div style="padding:2rem;color:#b89fd9;"><i class="fas fa-image" style="font-size:3rem;display:block;margin-bottom:1rem;color:#b77ee6;"></i>Gambar tidak tersedia</div>';
                };
            }
            
            if (counter) {
                counter.textContent = `${currentLightboxIndex + 1} / ${total}`;
            }
        }

        // ===== EVENT LISTENERS =====
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
            
            const closeBtn = document.getElementById('lightboxClose');
            const prevBtn = document.getElementById('lightboxPrev');
            const nextBtn = document.getElementById('lightboxNext');
            const overlay = document.getElementById('lightboxOverlay');
            
            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            if (prevBtn) prevBtn.addEventListener('click', () => navigateLightbox(-1));
            if (nextBtn) nextBtn.addEventListener('click', () => navigateLightbox(1));
            
            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeLightbox();
                });
            }
            
            document.addEventListener('keydown', (e) => {
                if (!overlay || !overlay.classList.contains('active')) return;
                
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    navigateLightbox(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateLightbox(1);
                }
            });
        });
    </script>
</body>
</html>
