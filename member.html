<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>UTARA GARAGE | Member's Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0515;
            font-family: 'Quicksand', sans-serif;
            color: #f0e6ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(156, 108, 214, 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(156, 108, 214, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(107, 70, 160, 0.25) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(183, 126, 230, 0.2) 0%, transparent 50%),
                        linear-gradient(135deg, #0a0515 0%, #150d25 50%, #0a0515 100%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1280px;
            width: 90%;
            margin: 0 auto;
            padding: 2rem 0;
            position: relative;
            z-index: 10;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(156, 108, 214, 0.2);
            border: 1px solid rgba(156, 108, 214, 0.5);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            color: #b77ee6;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: rgba(156, 108, 214, 0.4);
            transform: translateY(-2px);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 8vw, 3rem);
            background: linear-gradient(135deg, #e0d4ff, #b77ee6, #9c6cd6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #b89fd9;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .album-section {
            background: linear-gradient(135deg, rgba(107, 70, 160, 0.15), rgba(26, 15, 42, 0.4));
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(156, 108, 214, 0.3);
            text-align: center;
        }

        .album-title {
            font-size: 1.5rem;
            color: #b77ee6;
            margin-bottom: 1rem;
            font-family: 'Playfair Display', serif;
        }

        .album-image {
            max-width: 100%;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(156, 108, 214, 0.5);
            transition: transform 0.3s ease;
        }

        .album-image:hover {
            transform: scale(1.02);
        }

        /* ===== SEARCH BAR ===== */
        .search-section {
            margin: 1.5rem 0 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #b77ee6;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(26, 15, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(156, 108, 214, 0.4);
            border-radius: 60px;
            padding: 0.85rem 1rem 0.85rem 45px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
        }

        .search-input:focus {
            border-color: #b77ee6;
            box-shadow: 0 0 20px rgba(183, 126, 230, 0.3);
            background: rgba(26, 15, 42, 0.9);
        }

        .search-input::placeholder {
            color: #8a7bb0;
            font-size: 0.85rem;
        }

        .search-clear {
            background: rgba(156, 108, 214, 0.2);
            border: 1px solid rgba(156, 108, 214, 0.4);
            border-radius: 50px;
            padding: 0.7rem 1.2rem;
            color: #b77ee6;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .search-clear:hover {
            background: rgba(156, 108, 214, 0.4);
            transform: translateY(-2px);
        }

        .search-result-info {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: #b89fd9;
        }

        .search-result-info span {
            color: #b77ee6;
            font-weight: bold;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .member-card {
            background: rgba(15, 10, 25, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 1.2rem;
            text-align: center;
            border: 1px solid rgba(156, 108, 214, 0.3);
            transition: all 0.4s ease;
            animation: fadeInUp 0.6s ease backwards;
        }

        .member-card:hover {
            transform: translateY(-8px);
            border-color: #b77ee6;
            box-shadow: 0 20px 40px rgba(107, 70, 160, 0.3);
        }

        .member-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            overflow: hidden;
            border: 3px solid #b77ee6;
            box-shadow: 0 0 20px rgba(183, 126, 230, 0.3);
        }

        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-username {
            font-size: 1rem;
            font-weight: 700;
            margin: 0.5rem 0;
            color: #d4c0ff;
            word-break: break-all;
        }

        .btn-view-profile {
            background: transparent;
            border: 1.5px solid #9c6cd6;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: #b77ee6;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view-profile:hover {
            background: #9c6cd6;
            color: #0a0a0f;
        }

        .section-title {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 600;
            margin: 1rem 0 1rem;
            font-family: 'Playfair Display', serif;
            color: #b77ee6;
            position: relative;
            display: inline-block;
            text-align: center;
            width: 100%;
        }

        .section-title:before {
            content: '✦';
            position: absolute;
            left: -25px;
            top: 0;
            color: #9c6cd6;
            font-size: clamp(1rem, 4vw, 1.5rem);
        }

        .section-title:after {
            content: '✦';
            position: absolute;
            right: -25px;
            top: 0;
            color: #9c6cd6;
            font-size: clamp(1rem, 4vw, 1.5rem);
        }

        @media (max-width: 600px) {
            .section-title:before, .section-title:after {
                display: none;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* No result styling */
        .no-result {
            text-align: center;
            padding: 3rem;
            color: #b89fd9;
            background: rgba(15, 10, 25, 0.4);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            grid-column: 1 / -1;
        }

        .no-result i {
            font-size: 3rem;
            color: #b77ee6;
            margin-bottom: 1rem;
            display: block;
        }

        footer {
            text-align: center;
            border-top: 1px solid rgba(156, 108, 214, 0.3);
            padding: 2rem 1rem;
            margin-top: 2rem;
            background: rgba(10, 5, 21, 0.8);
            backdrop-filter: blur(10px);
        }

        .stats {
            background: rgba(156, 108, 214, 0.15);
            border-radius: 50px;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
            }
            .members-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
            .member-avatar {
                width: 80px;
                height: 80px;
            }
            .search-section {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper {
                max-width: 100%;
            }
            .search-clear {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-gradient"></div>

    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <h1>✦ MEMBER ALBUM ✦</h1>
            <p class="subtitle">Our Beloved Community Members</p>
        </div>

        <div class="album-section">
            <h2 class="album-title"><i class="fas fa-images"></i> MEMBER ALBUM</h2>
            <img src="mem.png" alt="Member Album" class="album-image" style="max-width: 100%;" onerror="this.src='https://placehold.co/800x400/2a1a3e/b77ee6?text=UTARA+GARAGE+MEMBER+ALBUM'">
            <p class="stats" style="margin-top: 1rem;"><i class="fas fa-users"></i> Total Members: <span id="memberCount">0</span></p>
        </div>

        <!-- ===== SEARCH BAR ===== -->
        <div class="search-section">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchMemberInput" class="search-input" placeholder="Cari nama member...">
            </div>
            <button id="clearSearchBtn" class="search-clear">
                <i class="fas fa-times"></i> Clear
            </button>
        </div>

        <div id="searchResultInfo" class="search-result-info" style="display: none;">
            Menampilkan <span id="resultCount">0</span> dari <span id="totalCount">0</span> member
        </div>

        <div class="section-title">⌇ OUR MEMBERS ⌇</div>
        <div class="members-grid" id="membersGrid"></div>
    </div>

    <footer>
        <div class="copyright"><i class="fas fa-moon"></i> UTARA GARAGE • MEMBER'S ALBUM • PURPLE DREAM<br><small>© 2026 Utara Garage - All Rights Reserved</small></div>
    </footer>

    <script src="config.js"></script>
    <script>
        let allMembers = [];
        let currentSearchQuery = "";

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderMembers(filteredMembers, searchQuery = "") {
            const grid = document.getElementById('membersGrid');
            const countSpan = document.getElementById('memberCount');
            const searchResultInfo = document.getElementById('searchResultInfo');
            const resultCountSpan = document.getElementById('resultCount');
            const totalCountSpan = document.getElementById('totalCount');
            
            if (!grid) return;
            
            const totalMembers = allMembers.length;
            if (countSpan) countSpan.textContent = totalMembers;
            
            if (filteredMembers.length === 0) {
                grid.innerHTML = `
                    <div class="no-result">
                        <i class="fas fa-user-slash"></i>
                        <p>✨ Tidak ada member dengan nama "${escapeHtml(searchQuery)}" ✨</p>
                        <p style="font-size: 0.7rem; margin-top: 0.5rem;">Coba kata kunci lain</p>
                    </div>
                `;
                if (searchResultInfo) {
                    if (searchQuery) {
                        searchResultInfo.style.display = 'block';
                        if (resultCountSpan) resultCountSpan.textContent = '0';
                        if (totalCountSpan) totalCountSpan.textContent = totalMembers;
                    } else {
                        searchResultInfo.style.display = 'none';
                    }
                }
                return;
            }
            
            // Tampilkan hasil pencarian
            if (searchResultInfo) {
                if (searchQuery) {
                    searchResultInfo.style.display = 'block';
                    if (resultCountSpan) resultCountSpan.textContent = filteredMembers.length;
                    if (totalCountSpan) totalCountSpan.textContent = totalMembers;
                } else {
                    searchResultInfo.style.display = 'none';
                }
            }
            
            grid.innerHTML = filteredMembers.map((member, index) => `
                <div class="member-card" style="animation-delay: ${index * 0.03}s">
                    <div class="member-avatar">
                        <img src="${member.avatar}" alt="${member.username}" onerror="this.src='https://placehold.co/100x100/2a1a3e/b77ee6?text=${member.username.charAt(0).toUpperCase()}'">
                    </div>
                    <div class="member-username">${escapeHtml(member.username)}</div>
                    <button class="btn-view-profile" onclick="window.open('${member.profile_link}', '_blank')">
                        <i class="fab fa-roblox"></i> View Profile
                    </button>
                </div>
            `).join('');
        }

        function filterMembersBySearch(query) {
            if (!query || query.trim() === "") {
                return allMembers;
            }
            const lowerQuery = query.toLowerCase().trim();
            return allMembers.filter(member => 
                member.username.toLowerCase().includes(lowerQuery)
            );
        }

        function handleSearch() {
            const searchInput = document.getElementById('searchMemberInput');
            currentSearchQuery = searchInput ? searchInput.value : "";
            const filtered = filterMembersBySearch(currentSearchQuery);
            renderMembers(filtered, currentSearchQuery);
        }

        function clearSearch() {
            const searchInput = document.getElementById('searchMemberInput');
            if (searchInput) {
                searchInput.value = "";
            }
            currentSearchQuery = "";
            renderMembers(allMembers, "");
        }

        // Inisialisasi data member
        function initMembers() {
            if (typeof MEMBERS_DATA !== 'undefined' && MEMBERS_DATA.length > 0) {
                allMembers = [...MEMBERS_DATA];
                renderMembers(allMembers, "");
            } else {
                const grid = document.getElementById('membersGrid');
                if (grid) {
                    grid.innerHTML = '<div class="no-result"><i class="fas fa-users-slash"></i><p>✨ Belum ada member yang terdaftar ✨</p></div>';
                }
                const countSpan = document.getElementById('memberCount');
                if (countSpan) countSpan.textContent = '0';
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            initMembers();
            
            const searchInput = document.getElementById('searchMemberInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleSearch();
                    }
                });
            }
            
            if (clearBtn) {
                clearBtn.addEventListener('click', clearSearch);
            }
        });
    </script>
</body>
</html>
